# =============================================================================
# FactBot — Docker Compose (VPS 169.58.111.12)
# -----------------------------------------------------------------------------
# Stack teman (nginx / factbot_web / factbot_db) SUDAH JALAN sebagai project
# sendiri. File ini hanya menambahkan service bot + bot-worker, yang BERGABUNG
# ke network Docker milik stack teman (external). Karena itu:
#   - TIDAK ada port publik di sini — nginx existing proxy /webhooks/ → bot:8001
#     via Docker DNS (resolver 127.0.0.11 + variable proxy_pass). bot:8001
#     hanya bisa diakses dari dalam network.
#   - Nama network: ${EXTERNAL_NETWORK} (cek: docker network ls di VPS).
#   - .env dipakai utk interpolasi compose DAN diteruskan ke container.
# Jalankan:  docker compose up -d
# =============================================================================
name: factbot

networks:
  web:
    external: true
    name: ${EXTERNAL_NETWORK:-factbot_net}

volumes:
  factbot_data:        # data/ job sqlite, reports .md
  whisper_cache:       # model faster-whisper (HF_HOME) — download sekali, dipakai bot & worker
  hermes_profile:      # Hermes brain state (memories, sessions) — persist di VPS
  searxng_config:      # SearXNG settings.yml (referensi laptop, secret VPS)
  searxng_cache:       # SearXNG cache (valkey) — persist

services:
  # ------------------------------------------------------------------ API --
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: factbot/bot:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    networks:
      - web
    # NO host ports. Debug dari host (opsional, bind 127.0.0.1 saja):
    # ports:
    #   - "127.0.0.1:8001:8001"
    volumes:
      - factbot_data:/app/data
      - whisper_cache:/home/appuser/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ------------------------------------------------------------- WORKER ------
  # Proses terpisah utk job analisa panjang (download video, transkripsi
  # faster-whisper, LLM, upload report). Image sama, command berbeda.
  # Queue: tabel `jobs` di PostgreSQL (SKIP LOCKED) — lihat app/worker.py.
  # Trade-off vs background-task in-process: lihat docs/DEPLOY_VPS.md §4.
  bot-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: factbot/bot:${IMAGE_TAG:-latest}
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    env_file: .env
    networks:
      - web
    volumes:
      - factbot_data:/app/data
      - whisper_cache:/home/appuser/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ------------------------------------------------------ HERMES BRAIN ------
  # Otak bot (profile factbot: SOUL/persona + memory knowledge + nanti
  # orchestrator sub-agents). Phase 1: di-deploy standby — pipeline masih
  # pakai DeepSeek langsung (app/pipeline/llm.py). Hermes brain di-wire
  # post-hackathon (docs/architecture_multi_platform.md §12).
  hermes-brain:
    build:
      context: ./hermes
    image: factbot/hermes-brain:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      HERMES_HOME: /hermes-data
      HERMES_PROFILE: factbot
      WEBHOOK_ENABLED: "true"
      WEBHOOK_PORT: "8644"
      WEBHOOK_SECRET: "${HERMES_WEBHOOK_SECRET:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"          # model brain (deepseek-v4-flash)
    volumes:
      - hermes_profile:/hermes-data                        # state persist
      - ./hermes-profiles/factbot:/hermes-data/profiles/factbot   # SOUL/config/skills (rw — Hermes tulis state cron/sessions)
    networks:
      - web
    healthcheck:
      test: ["CMD", "hermes", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------- SEARXNG ------
  # Metasearch engine (agregasi Google/Bing/DDG dll) — utk VALIDASI informasi
  # (Phase 2 pipeline) + Hermes brain. Referensi config: laptop Aviv
  # (~/searxng/core-config/settings.yml) — settings VPS di ./searxng/settings.yml.
  # NO port publik: hanya bisa diakses antar-container via Docker DNS
  # (http://searxng:8080). Bot worker (Phase 2) & hermes-brain pakai ini.
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    networks:
      - web
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - ./searxng/:/etc/searxng            # bind mount settings.yml (formats html+json, limiter off) — referensi laptop
      - searxng_cache:/var/cache/searxng
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ------------------------------------------------------- MCP-SEARXNG ------
  # MCP server: expose SearXNG sbg tool MCP (searxng_web_search, web_url_read)
  # utk Hermes brain & client MCP lain. HTTP transport (port 3000 internal).
  # Referensi laptop: ~/.hermes/node_modules/mcp-searxng (v1.11.0) + env
  # SEARXNG_URL. NO port publik — loopback saja kalau perlu (comment ports).
  mcp-searxng:
    image: isokoliuk/mcp-searxng:latest
    restart: unless-stopped
    networks:
      - web
    environment:
      SEARXNG_URL: http://searxng:8080
      MCP_HTTP_PORT: "3000"
      MCP_HTTP_HOST: 0.0.0.0
    # Debug dari host (opsional, bind 127.0.0.1 saja):
    # ports:
    #   - "127.0.0.1:3000:3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
