# =============================================================================
# nginx-webhooks.conf — potongan konfigurasi nginx untuk service FactBot "bot"
# -----------------------------------------------------------------------------
# Stack teman SUDAH punya location /webhooks/ → bot:8001 (variable + resolver).
# File ini sebagai referensi/backup & menambahkan endpoint bot lain yang
# mungkin belum di-proxy: /auth/ (OAuth IG), /health, /privacy, /terms.
#
# Cara pakai pada stack existing (nginx container):
#   1. Mount file ini ke /etc/nginx/conf.d/factbot-webhooks.conf (atau merge
#      isinya ke file vhost factbot.tech yang ada).
#   2. Pastikan location /webhooks/ yang lama tidak duplikat — hapus/sesuaikan.
#   3. docker exec <nginx> nginx -t && docker exec <nginx> nginx -s reload
#
# KENAPA variable + resolver:  dengan `proxy_pass $bot_upstream` yang memakai
# variable, nginx me-resolve DNS Docker (127.0.0.11) PER-REQUEST. Bot boleh
# restart / ganti IP berapa kali pun tanpa reload nginx.
# =============================================================================

# Docker embedded DNS (wajib di dalam container nginx yang join network Docker)
resolver 127.0.0.11 valid=10s ipv6=off;

# --- Webhook Meta (POST event + GET verify) ---
location /webhooks/ {
    set $bot_upstream http://bot:8001;
    proxy_pass $bot_upstream;                # URI asli (/webhooks/meta) diteruskan apa adanya
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_connect_timeout 5s;
}

# --- Health (UptimeRobot / Hermes cron / manual) ---
location = /health {
    set $bot_upstream http://bot:8001;
    proxy_pass $bot_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# --- OAuth callback Instagram Business Login ---
location /auth/ {
    set $bot_upstream http://bot:8001;
    proxy_pass $bot_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# --- Halaman kebijakan (dibutuhkan App Review Meta) ---
location = /privacy {
    set $bot_upstream http://bot:8001;
    proxy_pass $bot_upstream;
}
location = /terms {
    set $bot_upstream http://bot:8001;
    proxy_pass $bot_upstream;
}
