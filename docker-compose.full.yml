# =============================================================================
# docker-compose.full.yml — stack LENGKAP (nginx + web + db + bot + worker)
# -----------------------------------------------------------------------------
# ⚠️  PAKAI FILE INI HANYA UNTUK INSTALASI BARU / GREENFIELD.
#     Di VPS 169.58.111.12 stack nginx/web/db SUDAH JALAN (project milik teman)
#     → pakai docker-compose.yml (bot saja + external network) dan abaikan file ini.
#     Definisi nginx/web/db di bawah adalah TITIK AWAL (placeholder) — sesuaikan
#     dengan Dockerfile/konfigurasi Next.js & kredensial DB yang sebenarnya.
# =============================================================================
name: factbot

networks:
  frontend:
  backend:
    internal: true   # web + db + bot-worker tidak boleh keluar via port publik

volumes:
  pgdata:
  factbot_data:
  whisper_cache:

services:
  # ------------------------------------------------------------- NGINX ------
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/factbot-webhooks.conf:/etc/nginx/conf.d/factbot-webhooks.conf:ro
      - ./certs:/etc/nginx/certs:ro        # origin cert Cloudflare / Let's Encrypt
    depends_on:
      - bot
      - web
    networks: [frontend, backend]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ----------------------------------------------------------- WEB (Next.js) --
  web:
    build: ./factbot_web                    # sesuaikan path & Dockerfile Next.js
    container_name: factbot_web
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://factbot:${POSTGRES_PASSWORD}@db:5432/factbot
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # --------------------------------------------------------------- DB (PG 17) --
  db:
    image: postgres:17-alpine
    container_name: factbot_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: factbot
      POSTGRES_USER: factbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factbot -d factbot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------- BOT -------
  bot:
    build: { context: ., dockerfile: Dockerfile }
    image: factbot/bot:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://factbot:${POSTGRES_PASSWORD}@db:5432/factbot
    networks: [backend]
    volumes:
      - factbot_data:/app/data
      - whisper_cache:/home/appuser/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    stop_grace_period: 30s

  # ------------------------------------------------------------ WORKER -------
  bot-worker:
    build: { context: ., dockerfile: Dockerfile }
    image: factbot/bot:${IMAGE_TAG:-latest}
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://factbot:${POSTGRES_PASSWORD}@db:5432/factbot
    networks: [backend]
    volumes:
      - factbot_data:/app/data
      - whisper_cache:/home/appuser/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    stop_grace_period: 30s
